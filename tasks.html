<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>งานที่ต้องส่ง — Route Planner</title>
    <script>
        if ((localStorage.getItem('admin_theme') || 'light') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="app-config-init.js"></script>
    <script src="auth.js"></script>
    <script src="audit-log.js"></script>
    <script src="admin-theme.js"></script>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RoutePlan">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .scope-center { background:#dbeafe; color:#1e40af; }
        .scope-routes { background:#fef3c7; color:#92400e; }
        .badge-active   { background:#d1fae5; color:#065f46; }
        .badge-inactive { background:#fee2e2; color:#991b1b; }
        .route-chip { background:#f3f4f6; color:#374151; font-size:11px; font-weight:700; padding:2px 8px; border-radius:8px; }
        html.dark .scope-center { background:#1e3a5f; color:#93c5fd; }
        html.dark .scope-routes { background:#4a3510; color:#fcd34d; }
        html.dark .badge-active   { background:#0f3d33; color:#6ee7b7; }
        html.dark .badge-inactive { background:#4c1d1d; color:#fca5a5; }
        html.dark .route-chip { background:#334155; color:#cbd5e1; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen transition-colors">

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-24 opacity-0 bg-gray-900 text-white px-5 py-2.5 rounded-full shadow-2xl transition-all duration-300 z-[9999] text-sm font-bold pointer-events-none">
        <span id="toast-msg"></span>
    </div>

    <!-- Header -->
    <header class="bg-gray-900 text-white px-4 sm:px-6 h-14 shadow-md border-b-2 border-indigo-600 sticky top-0 z-50 flex items-center">
        <div class="flex items-center justify-between gap-3 w-full">
            <div class="flex items-center gap-3 min-w-0">
                <a href="center-select.html" class="text-base font-black text-indigo-400 tracking-wide hover:opacity-75 transition whitespace-nowrap">Route<span class="text-white">Plan</span></a>
                <span class="hidden sm:flex items-center gap-1.5 text-xs font-bold text-gray-400 pl-3 border-l border-gray-700 whitespace-nowrap">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="14" y2="15"/></svg>
                    งานที่ต้องส่ง
                </span>
            </div>
            <div id="admin-nav-root" class="flex items-center gap-3"></div>
            <div class="flex items-center gap-3 shrink-0">
                <span id="session-info" class="text-xs text-slate-400 font-medium hidden md:block"></span>
                <button onclick="Auth.logout()" class="text-xs text-slate-400 hover:text-red-400 font-bold transition">ออกจากระบบ</button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-4xl mx-auto p-6">

        <!-- Toolbar -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 p-4 mb-4 flex flex-wrap gap-3 items-center">
            <div id="center-select-wrap" class="flex-1 min-w-[180px]">
                <select id="center-select" onchange="TasksApp.onCenterChange(this.value)"
                    class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-600 text-gray-800 dark:text-slate-100 rounded-xl px-4 py-2 text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-300 dark:focus:ring-indigo-500">
                </select>
            </div>
            <button onclick="TasksApp.openCreate()"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition shadow-sm flex items-center gap-1.5">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                เพิ่มงาน
            </button>
            <button onclick="TasksApp.load()"
                class="bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950 dark:hover:bg-indigo-900 text-indigo-700 dark:text-indigo-300 border border-indigo-100 dark:border-indigo-800 px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-1.5">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                รีเฟรช
            </button>
        </div>

        <p class="text-xs text-gray-400 dark:text-slate-500 mb-3 px-1">คลิกที่วันในปฏิทินเพื่อดู/เพิ่มงานของวันนั้น — งานที่ตั้งไว้จะไปแสดงเป็นเตือนในหน้าปฏิทินฝั่ง Sales (อ่านอย่างเดียว ไม่ต้องกดยืนยันการส่ง)</p>

        <!-- Calendar -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 p-4">
            <div class="flex items-center justify-between mb-4">
                <button onclick="TasksApp.prevMonth()" class="w-9 h-9 rounded-xl border border-gray-200 dark:border-slate-600 bg-gray-50 dark:bg-slate-900 hover:bg-gray-100 dark:hover:bg-slate-700 text-gray-600 dark:text-slate-300 font-black transition">‹</button>
                <div id="cal-month-label" class="text-base font-black text-gray-800 dark:text-slate-100"></div>
                <button onclick="TasksApp.nextMonth()" class="w-9 h-9 rounded-xl border border-gray-200 dark:border-slate-600 bg-gray-50 dark:bg-slate-900 hover:bg-gray-100 dark:hover:bg-slate-700 text-gray-600 dark:text-slate-300 font-black transition">›</button>
            </div>
            <div class="grid grid-cols-7 gap-1 mb-1.5 text-center text-[11px] font-bold text-gray-400 dark:text-slate-500">
                <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
            </div>
            <div id="task-calendar-grid" class="grid grid-cols-7 gap-1.5"></div>
            <div class="flex items-center gap-4 mt-4 pt-3 border-t border-gray-50 dark:border-slate-700 text-[11px] text-gray-400 dark:text-slate-500 font-semibold">
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-[4px]" style="background:#fffbeb;border:1.5px solid #fcd34d;"></span> มีงาน (เปิดใช้งาน)</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-[4px]" style="background:#f9fafb;border:1.5px solid #e5e7eb;"></span> มีงาน (ปิดใช้งาน)</div>
            </div>
        </div>

    </main>

    <!-- Modal: Day Detail -->
    <div id="day-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[998] flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-sm">
            <div class="p-5 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center">
                <h2 id="day-modal-title" class="text-base font-black text-gray-800 dark:text-slate-100">วันที่</h2>
                <button onclick="TasksApp.closeDayModal()" class="w-8 h-8 rounded-full border border-gray-200 dark:border-slate-600 text-gray-400 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-700 transition shrink-0 flex items-center justify-center">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="p-5">
                <div id="day-task-list" class="flex flex-col gap-2 mb-4 max-h-[45vh] overflow-y-auto"></div>
                <button onclick="TasksApp.openCreateForDay()"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-2.5 text-sm font-bold transition shadow-sm flex items-center justify-center gap-1.5">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    เพิ่มงานวันนี้
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Create / Edit Task -->
    <div id="task-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[999] flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-md my-8">
            <div class="p-5 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center">
                <h2 id="modal-title" class="text-lg font-black text-gray-800 dark:text-slate-100">เพิ่มงาน</h2>
                <button onclick="TasksApp.closeModal()" class="w-8 h-8 rounded-full border border-gray-200 dark:border-slate-600 text-gray-400 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-700 transition flex items-center justify-center">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-slate-400 uppercase mb-1.5">ชื่องาน *</label>
                    <input id="f-title" type="text" placeholder="เช่น ส่งรายงาน KPI ประจำเดือน"
                        class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-600 text-gray-800 dark:text-slate-100 rounded-xl px-4 py-2.5 text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-300 dark:focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-slate-400 uppercase mb-1.5">รายละเอียด (ไม่บังคับ)</label>
                    <textarea id="f-desc" rows="2" placeholder="รายละเอียดเพิ่มเติม..."
                        class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-600 text-gray-800 dark:text-slate-100 rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-300 dark:focus:ring-indigo-500 resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-slate-400 uppercase mb-1.5">ขอบเขต</label>
                    <div class="flex gap-2 mb-2">
                        <button type="button" id="scope-btn-center" onclick="TasksApp.setScope('center')"
                            class="flex-1 py-2 rounded-xl text-sm font-bold border transition flex items-center justify-center gap-1.5">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><line x1="9" y1="7" x2="9" y2="7"/><line x1="15" y1="7" x2="15" y2="7"/><line x1="9" y1="12" x2="9" y2="12"/><line x1="15" y1="12" x2="15" y2="12"/></svg>
                            ทั้งศูนย์
                        </button>
                        <button type="button" id="scope-btn-routes" onclick="TasksApp.setScope('routes')"
                            class="flex-1 py-2 rounded-xl text-sm font-bold border transition flex items-center justify-center gap-1.5">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="8" width="14" height="9" rx="1.5"/><path d="M15 11h3.5l3.5 3.5V17a1 1 0 0 1-1 1H15z"/><circle cx="6" cy="19" r="1.6"/><circle cx="17.5" cy="19" r="1.6"/></svg>
                            เจาะจงสาย
                        </button>
                    </div>
                    <div id="routes-picker" class="hidden bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-600 rounded-xl p-3 max-h-36 overflow-y-auto">
                        <div id="routes-checklist" class="grid grid-cols-3 gap-2 text-xs"></div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-slate-400 uppercase mb-1.5">รูปแบบวันที่</label>
                    <div class="flex gap-2 mb-2">
                        <button type="button" id="date-btn-once" onclick="TasksApp.setDateType('once')"
                            class="flex-1 py-2 rounded-xl text-sm font-bold border transition flex items-center justify-center gap-1.5">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            ครั้งเดียว
                        </button>
                        <button type="button" id="date-btn-monthly" onclick="TasksApp.setDateType('monthly')"
                            class="flex-1 py-2 rounded-xl text-sm font-bold border transition flex items-center justify-center gap-1.5">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                            ซ้ำทุกเดือน
                        </button>
                    </div>
                    <input id="f-date-once" type="date"
                        class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-600 text-gray-800 dark:text-slate-100 rounded-xl px-4 py-2.5 text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-300 dark:focus:ring-indigo-500">
                    <div id="f-date-monthly-wrap" class="hidden flex items-center gap-2">
                        <span class="text-sm font-bold text-gray-600 dark:text-slate-300">ทุกวันที่</span>
                        <input id="f-date-monthly" type="number" min="1" max="31" placeholder="15"
                            class="w-24 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-600 text-gray-800 dark:text-slate-100 rounded-xl px-3 py-2.5 text-sm font-bold text-center outline-none focus:ring-2 focus:ring-indigo-300 dark:focus:ring-indigo-500">
                        <span class="text-sm font-bold text-gray-600 dark:text-slate-300">ของทุกเดือน</span>
                    </div>
                </div>

                <div class="flex items-center gap-3 pt-1">
                    <input type="checkbox" id="f-active" checked class="w-4 h-4 text-indigo-600 rounded">
                    <label for="f-active" class="text-sm font-bold text-gray-700 dark:text-slate-200">เปิดใช้งาน (แสดงในปฏิทิน Sales)</label>
                </div>
            </div>
            <div class="p-5 border-t border-gray-100 dark:border-slate-700 flex gap-3">
                <button onclick="TasksApp.closeModal()" class="flex-1 border border-gray-200 dark:border-slate-600 rounded-xl py-2.5 text-sm font-bold text-gray-600 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-700 transition">ยกเลิก</button>
                <button onclick="TasksApp.save()" id="btn-save" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-2.5 text-sm font-bold transition shadow-sm">บันทึก</button>
            </div>
        </div>
    </div>

    <script src="admin-nav.js"></script>
    <script src="tasks.js"></script>
    <script>
        if (typeof AdminNav !== 'undefined') AdminNav.render('tasks');
        // ปฏิทินใช้ inline style สี hex ตรงๆ (ไม่ใช่ Tailwind dark: class) — ต้อง re-render เองตอนสลับธีม
        document.addEventListener('admin-theme-change', () => TasksApp.renderCalendar());
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
